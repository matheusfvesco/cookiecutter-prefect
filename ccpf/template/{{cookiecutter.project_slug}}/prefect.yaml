---
# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: {{ cookiecutter.project_slug }}
prefect-version: {{ cookiecutter.prefect_version }}

# build section allows you to manage and build docker images
build:
  - prefect_docker.deployments.steps.build_docker_image:
      id: build_image
      requires: prefect-docker>=0.3.1
      image_name: {{ cookiecutter.image_name }}
      tag: {{ cookiecutter.image_tag }}
      dockerfile: auto

# push section allows you to manage if and how this project
# is uploaded to remote locations
push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.3.1
      image_name: {% raw %}'{{ build_image.image_name }}'{% endraw %}
      tag: {% raw %}'{{ build_image.tag }}'{% endraw %}

# pull section allows you to provide instructions for cloning
# this project in remote locations
pull:
  - prefect.deployments.steps.git_clone:
      repository: {% raw %}'{{ repository }}'{% endraw %}
      branch: {% raw %}'{{ branch }}'{% endraw %}
      access_token: null

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
  - name: null
    version: null
    tags: []
    description: null
    schedule: {}
    flow_name: null
    entrypoint: null
    parameters: {}
    work_pool:
      name: null
      work_queue_name: null
      job_variables:
        # uses the `image` output from the `build_image` step
        image: {% raw %}'{{ build_image.image }}'{% endraw %}

# Example event-triggered deployment. This block is documentation only.
# Uncomment and customize it when the project has a real event producer.
